name: Flex Window probe

# Reconnaissance only. Samsung's developer documentation is unreachable from
# the environment this repo is worked on in, but an Actions runner has open
# egress, so this fetches the pages describing how a widget opts in to a Flip's
# cover screen and prints them for reading back out of the log.
#
# It builds nothing and changes nothing.
on:
  push:
    paths:
      - '.github/workflows/flex-window-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the Flex Window widget documentation
        run: |
          for url in \
            'https://developer.samsung.com/codelab/galaxy-z/widget-flex-window.html' \
            'https://developer.samsung.com/galaxy-z/flex_window.html' \
            'https://akexorcist.dev/make-your-android-widget-display-on-the-cover-screen-of-the-samsung-galaxy-z-flip5/' \
          ; do
            echo "==================== $url ===================="
            curl -sSL --max-time 60 "$url" \
              | python3 -c "
import html, re, sys
raw = sys.stdin.read()
raw = re.sub(r'(?is)<(script|style|svg)\b.*?</\1>', ' ', raw)
text = html.unescape(re.sub(r'(?s)<[^>]+>', '\n', raw))
lines = [l.strip() for l in text.splitlines()]
print('\n'.join(l for l in lines if l))
" || echo "(fetch failed)"
          done
