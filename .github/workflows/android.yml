name: Android APK

# Builds an installable, sideloadable APK and attaches it to the run.
# Download it from the run's Artifacts section.
on:
  push:
    branches:
      - main
      - claude/claude-design-implementation-sye53r
    paths-ignore:
      - 'ingest/**'
      - '.github/workflows/ingest-probe.yml'
      - 'README.md'
      - 'design_reference/**'
      # feed/zones.json is deliberately NOT ignored: the list ships inside the
      # APK, so a new list means a new build is worth making.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The secrets context is not available in `if`, so they come through env.
    env:
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_ZONE_FEED_URL: ${{ secrets.EXPO_PUBLIC_ZONE_FEED_URL }}
      EXPO_PUBLIC_GOOGLE_ROUTES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_ROUTES_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Warn if the Maps key is missing
        if: env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY == ''
        run: |
          echo "::warning title=No Google Maps key::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is not set as a repository secret. The APK will build and run, but the map canvas will be blank. Add the secret and re-run to fix it."

      # The Maps key is written into AndroidManifest.xml here, not read at
      # runtime, so it has to be present before prebuild.
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      # Without these the APK is signed with the template's PUBLIC debug key,
      # which proves nothing about who built it. The script says so loudly if
      # the secrets are absent rather than quietly shipping debug-signed.
      - name: Restore the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "keystore restored ($(stat -c%s android/app/release.keystore) bytes)"

      - name: Configure release signing
        env:
          VERGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.mjs

      # Signed with the release keystore when the secrets are set, and with the
      # template's public debug key otherwise. Either way it sideloads.
      - name: Assemble release APK
        working-directory: android
        env:
          VERGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/verge-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: verge-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Read off the APK itself, so it reports what actually signed it rather
      # than what we hoped would. apksigner, not keytool: modern APKs carry only
      # a v2/v3 signature and `keytool -printcert -jarfile` cannot see those —
      # it exits non-zero, which is what killed build 12.
      #
      # Nothing here may fail the job. The APK is already built and uploaded;
      # losing it over a reporting step would be absurd.
      - name: Report the signing certificate
        continue-on-error: true
        run: |
          set -uo pipefail
          APK=dist/*.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning title=No apksigner::Cannot report the signing certificate."
            exit 0
          fi

          CERTS=$("$APKSIGNER" verify --print-certs $APK 2>&1) || {
            echo "::warning title=Could not read signature::$CERTS"
            exit 0
          }
          echo "$CERTS"

          SHA1=$(printf '%s\n' "$CERTS" | grep -m1 -i 'SHA-1 digest' | sed 's/.*digest: *//')
          DN=$(printf '%s\n' "$CERTS" | grep -m1 -i 'certificate DN' | sed 's/.*DN: *//')
          [ -n "$SHA1" ] || { echo "::warning title=No SHA-1 in output::"; exit 0; }

          # apksigner prints bare hex; the Google Cloud field wants colon pairs.
          SHA1_COLONS=$(printf '%s' "$SHA1" | tr -d ':' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "SIGNING_SHA1=$SHA1_COLONS" >> "$GITHUB_ENV"
          case "$DN" in
            *"Android Debug"*)
              echo "SIGNING_DEBUG=true" >> "$GITHUB_ENV"
              echo "::warning title=Debug-signed::Signed with the public debug key from the React Native template."
              ;;
          esac

          {
            echo '### Signing certificate'
            echo ''
            echo "Signed by: \`$DN\`"
            echo ''
            echo 'Google Cloud → Credentials → your key → Application restrictions → Android apps:'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo '| Package name | `com.hallkyle054.verge` |'
            echo "| SHA-1 fingerprint | \`$SHA1_COLONS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # An Actions artifact is a zip, which is awkward to install from a phone.
      # A release asset is a direct .apk link instead. The repo is private, so
      # the release is too.
      - name: Publish the APK as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAPS_KEY_SET: ${{ env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY != '' }}
        run: |
          set -uo pipefail
          TAG="apk-${GITHUB_RUN_NUMBER}"

          if [ -n "${SIGNING_SHA1:-}" ] && [ "${SIGNING_DEBUG:-}" != "true" ]; then
            SIGN_NOTE="Signed with the project release key (SHA-1 \`${SIGNING_SHA1}\`)."
          else
            SIGN_NOTE="Signed with the **public debug key** from the React Native template, so the signature proves nothing about who built it. Fine for your own phone; set the ANDROID_KEYSTORE_* secrets before giving it to anyone else."
          fi

          if [ "$MAPS_KEY_SET" = "true" ]; then
            MAP_NOTE="Built with a Google Maps key, so the map renders."
          else
            MAP_NOTE="Built **without** a Google Maps key, so the map canvas is blank. Every other screen works. Add the \`EXPO_PUBLIC_GOOGLE_MAPS_API_KEY\` repository secret and re-run to fix it."
          fi

          NOTES="Sideload build from \`${GITHUB_SHA}\`.

          $MAP_NOTE

          $SIGN_NOTE

          Carries the GoSafe enforcement zone list built into the app on the day of the build. It cannot refresh itself — install a newer build to pick up changes. A published zone is not a confirmation that a camera is present."

          # A re-run keeps the same run number, so the release may already exist.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "Verge APK (build ${GITHUB_RUN_NUMBER})" \
              --prerelease \
              --notes "$NOTES"
          fi

          if URL=$(gh release view "$TAG" --json url --jq .url 2>/dev/null); then
            {
              echo "### APK"
              echo "Maps key present: \`${MAPS_KEY_SET}\`"
              echo "Release: $URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### APK"
              echo 'Could not publish a release — the APK is attached to this run as the'
              echo '`verge-apk` artifact instead.'
              echo ''
              echo 'A 403 here means the workflow token lacks write access. Check'
              echo 'Settings → Actions → General → Workflow permissions is set to'
              echo '**Read and write permissions**.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Release not published::Download the verge-apk artifact from this run instead."
          fi
