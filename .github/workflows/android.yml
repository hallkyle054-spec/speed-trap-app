name: Android APK

# Builds an installable, sideloadable APK and attaches it to the run.
# Download it from the run's Artifacts section.
on:
  push:
    branches:
      - main
      - claude/claude-design-implementation-sye53r
    paths-ignore:
      - 'ingest/**'
      - '.github/workflows/ingest-probe.yml'
      - 'README.md'
      - 'design_reference/**'
      # feed/zones.json is deliberately NOT ignored: the list ships inside the
      # APK, so a new list means a new build is worth making.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The secrets context is not available in `if`, so they come through env.
    env:
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_ZONE_FEED_URL: ${{ secrets.EXPO_PUBLIC_ZONE_FEED_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Warn if the Maps key is missing
        if: env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY == ''
        run: |
          echo "::warning title=No Google Maps key::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is not set as a repository secret. The APK will build and run, but the map canvas will be blank. Add the secret and re-run to fix it."

      # The Maps key is written into AndroidManifest.xml here, not read at
      # runtime, so it has to be present before prebuild.
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      # Without these the APK is signed with the template's PUBLIC debug key,
      # which proves nothing about who built it. The script says so loudly if
      # the secrets are absent rather than quietly shipping debug-signed.
      - name: Restore the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "keystore restored ($(stat -c%s android/app/release.keystore) bytes)"

      - name: Configure release signing
        env:
          VERGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.mjs

      # Signed with the release keystore when the secrets are set, and with the
      # template's public debug key otherwise. Either way it sideloads.
      - name: Assemble release APK
        working-directory: android
        env:
          VERGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Read off the APK itself, so it reports what actually signed it rather
      # than what we hoped would. These are the values Google Cloud wants for an
      # Android application restriction on the Maps key.
      - name: Report the signing certificate
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          CERT=$(keytool -printcert -jarfile "$APK")
          SHA1=$(echo "$CERT" | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')
          OWNER=$(echo "$CERT" | grep -m1 'Owner:' | sed 's/.*Owner: *//')
          {
            echo '### Signing certificate'
            echo ''
            echo "Owner: \`$OWNER\`"
            echo ''
            echo 'Restrict the Google Maps key to this app in Google Cloud →'
            echo 'Credentials → your key → Application restrictions → Android apps:'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo '| Package name | `com.hallkyle054.verge` |'
            echo "| SHA-1 fingerprint | \`$SHA1\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "signing SHA-1: $SHA1"
          echo "SIGNING_SHA1=$SHA1" >> "$GITHUB_ENV"
          case "$OWNER" in
            *Android\ Debug*)
              echo "SIGNING_DEBUG=true" >> "$GITHUB_ENV"
              echo "::warning title=Debug-signed::This APK is signed with the public debug key, whose private key is published in the React Native template."
              ;;
          esac

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/verge-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: verge-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # An Actions artifact is a zip, which is awkward to install from a phone.
      # A release asset is a direct .apk link instead. The repo is private, so
      # the release is too.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
          MAPS_KEY_SET: ${{ env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY != '' }}
        run: |
          set -euo pipefail
          TAG="apk-${GITHUB_RUN_NUMBER}"

          if [ -n "${SIGNING_SHA1:-}" ] && [ "${SIGNING_DEBUG:-}" != "true" ]; then
            SIGN_NOTE="Signed with the project release key (SHA-1 \`${SIGNING_SHA1}\`)."
          else
            SIGN_NOTE="Signed with the **public debug key** from the React Native template, so the signature proves nothing about who built it. Fine for your own phone; set the ANDROID_KEYSTORE_* secrets before giving it to anyone else."
          fi

          if [ "$MAPS_KEY_SET" = "true" ]; then
            MAP_NOTE="Built with a Google Maps key, so the map renders."
          else
            MAP_NOTE="Built **without** a Google Maps key, so the map canvas is blank. Every other screen works. Add the \`EXPO_PUBLIC_GOOGLE_MAPS_API_KEY\` repository secret and re-run to fix it."
          fi

          NOTES="Sideload build from \`${GITHUB_SHA}\`.

          $MAP_NOTE

          $SIGN_NOTE

          The zone list is the committed fixture and its road geometry is approximate. Use it to judge the app, not to drive by."

          # A re-run keeps the same run number, so the release may already exist.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "Verge APK (build ${GITHUB_RUN_NUMBER})" \
              --prerelease \
              --notes "$NOTES"
          fi

          {
            echo "### APK"
            echo "Maps key present: \`${MAPS_KEY_SET}\`"
            echo "Release: $(gh release view "$TAG" --json url --jq .url)"
          } >> "$GITHUB_STEP_SUMMARY"
