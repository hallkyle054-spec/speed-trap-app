name: Zone feed

# Fetches the publisher's site list and commits the app's feed. One page load
# per run, from here rather than from anyone's phone.
on:
  schedule:
    # 05:20 UTC daily, off the hour so it does not pile onto the top-of-hour rush.
    - cron: '20 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest.yml'

permissions:
  contents: write

concurrency:
  group: zone-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the feed
        env:
          ZONE_AUTHORITIES: Carmarthenshire
        run: node ingest/build-feed.mjs

      - name: Commit it if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- feed/zones.json; then
            echo "no change in the published list"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add feed/zones.json
          git commit -m "Zone feed: $(date -u +%Y-%m-%d)"
          git push
          echo "feed updated" >> "$GITHUB_STEP_SUMMARY"
